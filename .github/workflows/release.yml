name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm OIDC trusted publishing (npm publish --provenance).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.x (not 20.x): tsdown loads tsdown.config.ts via the optional
          # `unrun` peer dep on Node <22.13, and unrun itself requires Node
          # ^22.13.0 || >=24.0.0 (2026-08-21 CI build failures - "unrun"
          # import error). This only affects the build TOOLCHAIN's Node
          # version, not the package's own target (tsdown.config.ts still
          # targets node20.0.0 for consumers).
          node-version: "22.x"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # Pinned, not `npm@latest`: npm 12 requires Node >=22.9.0, which
      # breaks this job's Node 20.x runner (EBADENGINE, 2026-08-21). npm
      # 11.5.1 is the actual minimum needed for OIDC trusted publishing and
      # still supports Node ^20.17.0.
      - name: Ensure npm CLI supports trusted publishing (>=11.5.1)
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and test
        run: |
          npm run lint
          npm run typecheck
          npm test -- --ci

      - name: Build
        run: npm run build

      - name: Verify package (attw + publint)
        run: |
          npm run check:types
          npm run check:pack

      # Creates a "Version Packages" PR when changesets are pending, or
      # publishes to npm (with provenance, via OIDC trusted publishing -
      # no NPM_TOKEN secret involved) when changesets have already been
      # versioned into package.json on main.
      - name: Create Release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
