name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.x (not 20.x): tsdown loads tsdown.config.ts via the optional
          # `unrun` peer dep on Node <22.13, and unrun itself requires Node
          # ^22.13.0 || >=24.0.0 (2026-08-21 CI build failures - "unrun"
          # import error). This only affects the build TOOLCHAIN's Node
          # version, not the package's own target (tsdown.config.ts still
          # targets node20.0.0 for consumers).
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Check package types (attw)
        run: npm run check:types

      - name: Check package publishing (publint)
        run: npm run check:pack
